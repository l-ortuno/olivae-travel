<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <title>Save your favourite flights — OLIVAE</title>
  <desc>Minimalist travel illustration showing a saved favourite flight with a heart, airplane and boarding pass.</desc>

  <!-- Transparent background -->

  <!-- Decorative flight path -->
  <path d="M105 430 C180 360 215 455 285 390 S420 300 500 355 S620 335 690 220"
        fill="none"
        stroke="#4B5A2A"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="2 22"/>

  <!-- Boarding pass -->
  <g transform="rotate(-5 350 330)">
    <rect x="170" y="205" width="370" height="220" rx="24"
          fill="#FFFFFF" stroke="#4B5A2A" stroke-width="9"/>

    <!-- Perforated divider -->
    <path d="M425 210 V420"
          stroke="#4B5A2A" stroke-width="6"
          stroke-dasharray="8 12"/>

    <!-- Departure / arrival -->
    <text x="205" y="270"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="22" font-weight="700">MAD</text>

    <text x="350" y="270"
          text-anchor="middle"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16">✈</text>

    <text x="385" y="270"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="22" font-weight="700">ATH</text>

    <!-- Route line -->
    <path d="M210 292 H385"
          stroke="#4B5A2A" stroke-width="5"
          stroke-linecap="round"/>

    <circle cx="210" cy="292" r="7" fill="#4B5A2A"/>
    <circle cx="385" cy="292" r="7" fill="#4B5A2A"/>

    <!-- Flight details -->
    <text x="205" y="340"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15">JUN 18</text>

    <text x="300" y="340"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15">08:45</text>

    <text x="205" y="375"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13">OLIVAE AIR</text>

    <!-- Saved label -->
    <text x="450" y="270"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700">SAVED</text>

    <!-- Bookmark -->
    <path d="M490 300 V365 L510 350 L530 365 V300 Z"
          fill="#4B5A2A"/>
  </g>

  <!-- Favourite heart -->
  <path d="M605 135
           C580 105 525 120 525 165
           C525 205 605 255 605 255
           C605 255 685 205 685 165
           C685 120 630 105 605 135Z"
        fill="#4B5A2A"/>

  <!-- Small heart highlight -->
  <path d="M558 155 C565 143 579 140 589 148"
        fill="none"
        stroke="#FAF8F2"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- Airplane accent -->
  <g fill="#4B5A2A" transform="translate(80 115) rotate(-18)">
    <path d="M0 22 L82 0 L61 28 L82 53 L0 30 Z"/>
    <path d="M31 18 L44 -13 L53 -11 L49 21 Z"/>
    <path d="M32 32 L44 63 L53 60 L49 29 Z"/>
  </g>

  <!-- Small olive branch accent -->
  <path d="M540 490 C585 455 625 438 680 425"
        fill="none"
        stroke="#4B5A2A"
        stroke-width="7"
        stroke-linecap="round"/>

  <g fill="#4B5A2A">
    <ellipse cx="590" cy="456" rx="11" ry="29" transform="rotate(48 590 456)"/>
    <ellipse cx="622" cy="443" rx="11" ry="29" transform="rotate(67 622 443)"/>
    <ellipse cx="651" cy="430" rx="10" ry="27" transform="rotate(75 651 430)"/>
    <circle cx="570" cy="472" r="10"/>
  </g>
</svg>
