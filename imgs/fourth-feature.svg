<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <title>Keep track of how much it would cost you — OLIVAE</title>
  <desc>Minimalist travel budgeting illustration with a calculator, coins, price tag and flight route.</desc>

  <!-- Transparent background -->

  <!-- Decorative travel path -->
  <path d="M105 455 C175 385 225 470 300 400 S430 315 510 370 S625 330 695 225"
        fill="none"
        stroke="#4B5A2A"
        stroke-width="7"
        stroke-linecap="round"
        stroke-dasharray="2 22"/>

  <!-- Calculator -->
  <g>
    <rect x="190" y="145" width="265" height="330" rx="28"
          fill="#FFFFFF" stroke="#4B5A2A" stroke-width="9"/>

    <!-- Display -->
    <rect x="220" y="180" width="205" height="72" rx="12"
          fill="#4B5A2A"/>
    <text x="405" y="228"
          text-anchor="end"
          fill="#FFFFFF"
          font-family="Arial, Helvetica, sans-serif"
          font-size="32" font-weight="700">€1,248</text>

    <!-- Calculator buttons -->
    <g fill="none" stroke="#4B5A2A" stroke-width="6">
      <rect x="220" y="280" width="42" height="38" rx="8"/>
      <rect x="276" y="280" width="42" height="38" rx="8"/>
      <rect x="332" y="280" width="42" height="38" rx="8"/>
      <rect x="388" y="280" width="37" height="38" rx="8"/>

      <rect x="220" y="335" width="42" height="38" rx="8"/>
      <rect x="276" y="335" width="42" height="38" rx="8"/>
      <rect x="332" y="335" width="42" height="38" rx="8"/>
      <rect x="388" y="335" width="37" height="38" rx="8"/>

      <rect x="220" y="390" width="42" height="38" rx="8"/>
      <rect x="276" y="390" width="42" height="38" rx="8"/>
      <rect x="332" y="390" width="42" height="38" rx="8"/>
      <rect x="388" y="390" width="37" height="38" rx="8"/>
    </g>
  </g>

  <!-- Price tag -->
  <g transform="rotate(12 565 260)">
    <path d="M505 195 H615 L665 245 L615 295 H505 Z"
          fill="#FFFFFF" stroke="#4B5A2A" stroke-width="9"
          stroke-linejoin="round"/>
    <circle cx="530" cy="245" r="10"
            fill="none" stroke="#4B5A2A" stroke-width="6"/>
    <text x="585" y="258"
          text-anchor="middle"
          fill="#4B5A2A"
          font-family="Arial, Helvetica, sans-serif"
          font-size="28" font-weight="700">€</text>
  </g>

  <!-- Coins -->
  <g fill="#FFFFFF" stroke="#4B5A2A" stroke-width="7">
    <ellipse cx="560" cy="365" rx="48" ry="17"/>
    <path d="M512 365 V405 C512 414 534 422 560 422 C586 422 608 414 608 405 V365"/>
    <ellipse cx="560" cy="365" rx="48" ry="17"/>
    <ellipse cx="625" cy="390" rx="42" ry="15"/>
    <path d="M583 390 V425 C583 433 602 440 625 440 C648 440 667 433 667 425 V390"/>
    <ellipse cx="625" cy="390" rx="42" ry="15"/>
  </g>

  <!-- Coin symbols -->
  <text x="560" y="376"
        text-anchor="middle"
        fill="#4B5A2A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700">€</text>
  <text x="625" y="399"
        text-anchor="middle"
        fill="#4B5A2A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="700">€</text>

  <!-- Airplane accent -->
  <g fill="#4B5A2A" transform="translate(78 120) rotate(-18)">
    <path d="M0 22 L82 0 L61 28 L82 53 L0 30 Z"/>
    <path d="M31 18 L44 -13 L53 -11 L49 21 Z"/>
    <path d="M32 32 L44 63 L53 60 L49 29 Z"/>
  </g>

  <!-- Small olive branch accent -->
  <path d="M145 510 C190 480 230 470 275 462"
        fill="none"
        stroke="#4B5A2A"
        stroke-width="7"
        stroke-linecap="round"/>

  <g fill="#4B5A2A">
    <ellipse cx="190" cy="482" rx="11" ry="29" transform="rotate(48 190 482)"/>
    <ellipse cx="222" cy="472" rx="11" ry="29" transform="rotate(67 222 472)"/>
    <ellipse cx="250" cy="464" rx="10" ry="27" transform="rotate(75 250 464)"/>
    <circle cx="172" cy="495" r="10"/>
  </g>
</svg>
