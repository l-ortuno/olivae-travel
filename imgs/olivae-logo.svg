<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <title>OLIVAE — minimal travel logo</title>
  <desc>Minimalist olive branch and airplane travel logo in olive green.</desc>

  <!-- Transparent background: no background rectangle is included -->
  <g fill="none" stroke="#4B5A2A" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open circular travel mark -->
    <path d="M 545 112 A 285 285 0 1 0 675 260" stroke-width="13"/>

    <!-- Olive branch stem -->
    <path d="M 255 515 C 275 430 315 350 385 292" stroke-width="10"/>

    <!-- Branches -->
    <path d="M 300 400 C 355 382 400 350 425 320" stroke-width="8"/>
    <path d="M 280 450 C 330 430 365 410 390 390" stroke-width="8"/>
    <path d="M 325 355 C 330 320 338 290 350 265" stroke-width="8"/>
  </g>

  <!-- Olive leaves -->
  <g fill="#4B5A2A">
    <ellipse cx="350" cy="285" rx="17" ry="55" transform="rotate(12 350 285)"/>
    <ellipse cx="398" cy="340" rx="20" ry="58" transform="rotate(55 398 340)"/>
    <ellipse cx="342" cy="405" rx="18" ry="52" transform="rotate(68 342 405)"/>
    <ellipse cx="315" cy="430" rx="17" ry="49" transform="rotate(-18 315 430)"/>
  </g>

  <!-- Olive fruit -->
  <ellipse cx="285" cy="475" rx="23" ry="31" fill="#4B5A2A"/>
  <path d="M 280 447 C 282 438 288 432 297 428" fill="none"
        stroke="#4B5A2A" stroke-width="7" stroke-linecap="round"/>

  <!-- Minimal airplane -->
  <g fill="#4B5A2A" transform="translate(575 145) rotate(-25)">
    <path d="M0 22 L72 0 L53 28 L72 50 L0 29 Z"/>
    <path d="M27 18 L39 -13 L47 -11 L45 21 Z"/>
    <path d="M28 31 L39 58 L47 56 L45 28 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="720"
        text-anchor="middle"
        fill="#4B5A2A"
        font-family="Cormorant Garamond, Georgia, Times New Roman, serif"
        font-size="92"
        font-weight="500"
        letter-spacing="24">OLIVAE</text>
</svg>
